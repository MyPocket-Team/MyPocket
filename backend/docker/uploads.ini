; Limites augmentées pour accepter les photos prises directement avec l'appareil
; photo d'un téléphone (souvent 3-10 Mo) et laisser le temps à la conversion
; audio (ffmpeg) + l'appel Gemini de se terminer, même sur un réseau mobile lent.
; Sans ce fichier, PHP utilise ses valeurs par défaut (upload_max_filesize=2M,
; post_max_size=8M), qui rejettent silencieusement toute photo de téléphone
; avant même que Laravel ne la voie.
upload_max_filesize = 25M
post_max_size = 30M
memory_limit = 256M
max_execution_time = 120
max_input_time = 120
